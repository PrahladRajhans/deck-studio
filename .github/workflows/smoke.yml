name: smoke-test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for the HTML draft renderer
        run: python -m playwright install --with-deps chromium
      - name: Install fonts (metric-compatible Office clones), LibreOffice and poppler for PPTX renders
        run: sudo apt-get update && sudo apt-get install -y libcairo2 fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation fonts-texgyre libreoffice-impress poppler-utils
      - name: Run smoke tests (drafts, strict PPTX builds, renders, lint, unit tests)
        run: bash tests/smoke_test.sh out/smoke
      - name: Upload drafts and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: out/smoke
